[project]
name = "fastapi-starter"
version = "1.0.0"
description = "FastAPI starter with auth, email and a central response/error format"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions", "*.md"]  # README code blocks are examples, not project code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  "B008",   # FastAPI uses function calls (Depends, Query) in defaults
  "UP046",  # keep the classic Generic[T] syntax: closer to TypeScript generics
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]  # Alembic sets up config before importing the app

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
